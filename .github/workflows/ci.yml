name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pipewatch
          POSTGRES_PASSWORD: pipewatch
          POSTGRES_DB: pipewatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pipewatch" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://pipewatch:pipewatch@localhost:5432/pipewatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=pipewatch --cov-report=term-missing --cov-fail-under=85

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and unit-test alert rules
        run: |
          docker run --rm -v "$PWD/observability:/obs" --entrypoint promtool \
            prom/prometheus:v2.53.0 check rules /obs/alert_rules.yml
          docker run --rm -v "$PWD/observability:/obs" --entrypoint promtool \
            prom/prometheus:v2.53.0 test rules /obs/alert_rules_test.yml
      - name: Validate Alertmanager config
        run: |
          docker run --rm -v "$PWD/observability:/obs" --entrypoint amtool \
            prom/alertmanager:v0.27.0 check-config /obs/alertmanager.yml

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  image:
    needs: [test, observability]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/pipewatch:latest
            ghcr.io/${{ github.repository_owner }}/pipewatch:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
