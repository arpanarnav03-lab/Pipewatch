services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pipewatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipewatch}
      POSTGRES_DB: pipewatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipewatch -d pipewatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://pipewatch:${POSTGRES_PASSWORD:-pipewatch}@postgres:5432/pipewatch
      PIPEWATCH_SOURCE: ${PIPEWATCH_SOURCE:-synthetic}
      PIPEWATCH_RUN_INTERVAL_MINUTES: ${PIPEWATCH_RUN_INTERVAL_MINUTES:-2}
      PIPEWATCH_ALLOW_FAULT_INJECTION: ${PIPEWATCH_ALLOW_FAULT_INJECTION:-true}
      PIPEWATCH_LOG_LEVEL: ${PIPEWATCH_LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  promdata:
  grafanadata:
